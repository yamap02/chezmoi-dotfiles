# atuin 設定 (https://docs.atuin.sh/configuration/config/)

# 同期サーバーは使わない (ログインしない限り同期されないが、明示的に止める)
auto_sync = false
update_check = false

# 検索 UI
search_mode = "fuzzy"
filter_mode = "global"
style = "compact"
inline_height = 20
# Enter で即実行せず、選んだコマンドを編集できる状態でプロンプトに戻す
enter_accept = false

# base.zsh の HISTORY_IGNORE と同じコマンドは記録しない
history_filter = [
  "^(ls|ll|la|pwd|cd \\.\\.|cd)$",
  "^task ",
  "^jrnl ",
]
