# Allow slow cold starts of version probes (e.g. `node --version`) to finish
# instead of printing timeout warnings. The default is 500ms.
command_timeout = 1000

# Keep the left side to location and git state; language versions go right.
# $all would also repeat the right-side modules on the left, so list them.
format = """
$username$hostname$shlvl$directory\
$git_branch$git_commit$git_state$git_metrics$git_status\
$docker_context$direnv$cmd_duration\
$line_break\
$jobs$status$container$character"""
right_format = "$nodejs$python$golang$rust$terraform"

# Keep the active gcloud context available to gcloud itself without exposing
# the authenticated account email in the shell prompt.
[gcloud]
disabled = true

# Show the exit code of a failed command, per stage of a pipeline.
[status]
disabled = false
pipestatus = true

# Show whether the current .envrc is loaded and allowed.
[direnv]
disabled = false

# Show added/deleted line counts of uncommitted changes.
[git_metrics]
disabled = false
