# Allow slow cold starts of version probes (e.g. `node --version`) to finish
# instead of printing timeout warnings. The default is 500ms.
command_timeout = 1000

# Language versions go right. $all skips modules placed in right_format.
format = "$all"
right_format = "$python$golang$rust$terraform"

# Probing `node --version` took ~60ms per prompt in a Node project.
[nodejs]
disabled = true

# Keep the active gcloud context available to gcloud itself without exposing
# the authenticated account email in the shell prompt.
[gcloud]
disabled = true

# Show the exit code of a failed command, per stage of a pipeline.
[status]
disabled = false
pipestatus = true

# Show whether the current .envrc is loaded and allowed.
[direnv]
disabled = false

# Show added/deleted line counts of uncommitted changes.
[git_metrics]
disabled = false
